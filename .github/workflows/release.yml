name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    name: Test, tag and publish
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Verify workflow runs from main
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Package releases must be run from the main branch"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@kz-rush'

      - name: Validate release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: ${RELEASE_VERSION}"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "Requested version: ${RELEASE_VERSION}"
          echo "package.json version: ${PACKAGE_VERSION}"

          if [ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::package.json version ${PACKAGE_VERSION} does not match requested release ${RELEASE_VERSION}"
            exit 1
          fi

      - name: Check release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG="v${RELEASE_VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
            CURRENT_COMMIT="${GITHUB_SHA}"

            if [ "${TAG_COMMIT}" != "${CURRENT_COMMIT}" ]; then
              echo "::error::Tag ${TAG} exists but points to ${TAG_COMMIT}, not current commit ${CURRENT_COMMIT}"
              exit 1
            fi

            echo "Tag ${TAG} already exists on this commit."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Storybook tests
        run: npm run test:storybook

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Create release tag
        if: steps.release_tag.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          TAG="v${RELEASE_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
